# The base of the Grocy Next deployment. It holds the Deployment, the Service,
# and the ConfigMap. The three probes are in the Deployment. Do not apply the
# base alone. Apply an overlay. The `sqlite` overlay adds the volume for the
# SQLite file. The base sets no namespace. The overlay or the `kubectl`
# command sets it.
#
# The ConfigMap holds the variables that are not secret. The name gets a hash
# suffix, so a change to a value restarts the pod. An overlay changes or adds
# a value with a `configMapGenerator` entry that has the same name and
# `behavior: merge`.
#
# The Grocy URL and the Grocy API key come from one Secret that the user
# creates. See `deploy/kubernetes/README.md`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: grocy-next
    literals:
      - DB_ENGINE=sqlite
