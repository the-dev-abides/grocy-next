packages:
  - 'apps/*'
  - 'libs/**'

catalog:
  # TypeScript stays on 6.0.x. TypeScript 7.0 ships no JavaScript compiler
  # API. typescript-eslint, the NestJS swagger plugin, and the NestJS CLI do
  # not load it. Move to TypeScript 7 when those tools accept it.
  typescript: ~6.0.3

# pnpm installs no version that is younger than one day. This is the pnpm
# default (minimumReleaseAge 1440). A package that is newer than one day
# resolves to its newest version that is older than one day.

# Packages that may run their install scripts. pnpm blocks every other one.
allowBuilds:
  nx: true
  '@swc/core': true
  '@parcel/watcher': true
  # @scarf/scarf sends install telemetry. Its script stays blocked.
  '@scarf/scarf': false
