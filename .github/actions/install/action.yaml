# This action installs the workspace on a GitHub-hosted runner. Every job of
# the CI workflow runs it first. pnpm comes from the `packageManager` field of
# `package.json`. Node comes from `.nvmrc`. The Node action caches the pnpm
# store between runs. The lockfile is the cache key.
name: Install the workspace
description: Installs pnpm, Node, and the packages of the workspace.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.1

    - name: Install Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install the packages
      shell: bash
      run: pnpm install --frozen-lockfile
