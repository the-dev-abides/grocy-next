# The CI checks. The workflow runs on every pull request and on every push to
# `main`, on GitHub-hosted runners. These jobs run in parallel:
#
# - `lint` runs the lint of every project. A warning fails it.
# - `typecheck` runs the type check of every project.
# - `format` checks that every file is formatted.
# - `knip` reports an unused file, export, or dependency, and a missing
#   dependency.
# - `test` runs the unit tests of every project.
# - `start-sqlite` builds the API, starts it against SQLite, and calls the
#   three health checks.
# - `start-postgres` builds the API, starts it against a PostgreSQL service
#   container, and calls the three health checks.
# - `image` builds the container image two times, one time for each
#   architecture, each on a runner of that architecture. No build uses
#   emulation. Each job starts the built image and calls the three health
#   checks. On a push to `main`, each job then pushes its image to the GitHub
#   Container Registry (GHCR) by digest, with no tag.
#
# On a push to `main`, the `manifest` job runs after the two `image` jobs. It
# merges the two digests into one manifest and gives the manifest two tags:
# the commit SHA and `main`. A pull request run pushes no image.
#
# A lint error, a type error, a format error, a knip report, a failed test,
# a failed start, or a failed build fails the workflow. Each job stops after 15 minutes. Every third-party action is pinned
# to a commit SHA. The tag in the comment names the release.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a branch cancels the run that is still in progress for that
# branch. A push to `main` cancels nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The API exits at start when the two Grocy variables are missing. No
  # health check calls Grocy, so the values here point at no instance. RFC 2606
  # reserves the `.invalid` domain. It never resolves.
  GROCY_URL: http://grocy.invalid
  GROCY_API_KEY: ci
  # The image name on GHCR. The `image` job and the `manifest` job use it.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Lint every project
        run: pnpm nx run-many -t lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Type check every project
        run: pnpm nx run-many -t typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Check the format of every file
        run: pnpm nx format:check

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Report unused code and dependencies
        run: pnpm exec knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Run the unit tests of every project
        run: pnpm nx run-many -t test

  start-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Build the API
        run: pnpm nx build api
      - name: Start the API
        env:
          DB_FILE: ${{ runner.temp }}/grocy-next.db
        run: |
          node apps/api/dist/main.mjs > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
      - name: Call the health checks
        run: bash .github/scripts/check-health.sh
      - name: Show the API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  start-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: grocy-next
      DB_USER: grocy-next
      DB_PASSWORD: grocy-next
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        # The job waits for this health check before the first step runs. The
        # `options` field cannot read the job `env`, so the user and the
        # database are literal here.
        options: >-
          --health-cmd "pg_isready -U grocy-next -d grocy-next"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Build the API
        run: pnpm nx build api
      - name: Start the API
        run: |
          node apps/api/dist/main.mjs > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
      - name: Call the health checks
        run: bash .github/scripts/check-health.sh
      - name: Show the API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build runs one time. The layer cache lives in the GitHub Actions
      # cache, with one scope for each architecture. The result loads into the
      # Docker daemon of the runner under a local tag, so the next step can
      # start it.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: grocy-next:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Start the image
        id: start
        run: |
          docker run --detach --name api --publish 3000:3000 \
            --env GROCY_URL --env GROCY_API_KEY grocy-next:ci

      - name: Call the health checks
        env:
          API_CONTAINER: api
        run: bash .github/scripts/check-health.sh

      - name: Show the container log
        if: failure() && steps.start.outcome == 'success'
        run: docker logs api

      # The rest of the job runs on a push to `main` only. The push takes the
      # image from the cache of the first build, so no build step runs again.
      # The image goes to GHCR by digest, with no tag. The `manifest` job
      # gives the tags to the merged manifest.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image by digest
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The job passes the digest to the `manifest` job as an empty file. The
      # file name is the digest.
      - name: Export the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The manifest gets two tags: the full commit SHA and the branch name
      # `main`.
      - name: Compute the tags
        id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      # One manifest holds the two images. The file names in the digests folder
      # are the digests.
      - name: Merge the manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the manifest
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.tags.outputs.version }}"
