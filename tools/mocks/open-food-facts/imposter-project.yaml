# The Imposter project configuration of the Open Food Facts mock. The Imposter
# CLI reads this file from the mock folder. ADR 0015 pins the engine version
# and the CLI version here. The engine is the native engine, one binary with
# no runtime. The CLI downloads the engine on the first start. The Grocy mock
# has the same file.
#
# The native engine: https://github.com/imposter-project/imposter-go/releases
# The CLI: https://github.com/imposter-project/imposter-cli/releases
engine: native
version: '5.21.3'
cli:
  version: '1.13.0'
