# Grocy Next on PostgreSQL. Two services: the app and a PostgreSQL that this
# file runs for you. This is the deployment for Docker Compose and for a
# Portainer stack when you want PostgreSQL and have no database server.
#
# Set the two Grocy variables and the database password in the shell, in a
# `.env` file next to this file, or in the stack environment of Portainer.
# Then run:
#
#   docker compose -f compose.postgres.yaml up -d
#
# `GROCY_URL` is the address of your Grocy instance, as the container reaches
# it. `GROCY_API_KEY` is a key from the Grocy "Manage API keys" page.
# `DB_PASSWORD` is the password of the database user. Compose stops with a
# message when one of the three is not set.
#
# The defaults for the database name and the user are `grocy-next`. A change
# to a `DB_*` value after the first start does not change the database.
# Remove the `postgres-data` volume and start again.
#
# The online barcode lookup is on. To turn it off, set `BARCODE_LOOKUP=off`.
# To point the lookup at a mirror of Open Food Facts, set `OPEN_FACTS_URL`.
#
# The MCP server is off. To turn it on, set `MCP_TOKEN` to a token of 32
# characters or more. `openssl rand -hex 32` makes a good token. The page
# `docs/user/connect-an-assistant.md` tells you how to connect an assistant.
#
# The app listens on port 3000. PostgreSQL publishes no port.

name: grocy-next-postgres

services:
  app:
    image: ghcr.io/the-dev-abides/grocy-next:main
    environment:
      GROCY_URL: ${GROCY_URL:?Set GROCY_URL to the address of your Grocy instance}
      GROCY_API_KEY: ${GROCY_API_KEY:?Set GROCY_API_KEY to an API key of your Grocy instance}
      DB_ENGINE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-grocy-next}
      DB_USER: ${DB_USER:-grocy-next}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a password for the database user}
      BARCODE_LOOKUP: ${BARCODE_LOOKUP:-on}
      OPEN_FACTS_URL: ${OPEN_FACTS_URL:-https://world.openfoodfacts.org}
      MCP_TOKEN: ${MCP_TOKEN:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL 18 keeps its data under `/var/lib/postgresql`, not under
  # `/var/lib/postgresql/data`.
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-grocy-next}
      POSTGRES_USER: ${DB_USER:-grocy-next}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a password for the database user}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
